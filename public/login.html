<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3D2B1F">
    <title>Periplus · 行纪</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="card">
        <img class="logo" src="img/ayacloud.png" alt="">
        <h1>Periplus · 行纪</h1>
        <form id="form">
            <label><span data-t="username"></span>
                <input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
            <label><span data-t="password"></span>
                <input name="password" type="password" autocomplete="current-password" required></label>
            <p class="error" id="error" role="alert"></p>
            <button class="primary" type="submit" data-t="login"></button>
        </form>
        <p class="hint" data-t="hint"></p>
    </main>

    <script type="module">
        // 独立页面，不走应用的 i18n 模块，只要这几句话；语言跟随应用（mapweb.lang）
        const TEXT = {
            zh: { username: '用户名', password: '密码', login: '登录', hint: '没有账户？请联系管理员为你创建。',
                failed: '用户名或密码不对', blocked: '尝试次数太多，请 15 分钟后再试', network: '无法连接服务器' },
            en: { username: 'Username', password: 'Password', login: 'Sign in', hint: 'No account? Ask the administrator to create one for you.',
                failed: 'Wrong username or password', blocked: 'Too many attempts, try again in 15 minutes', network: 'Cannot reach the server' },
            fr: { username: 'Nom d’utilisateur', password: 'Mot de passe', login: 'Se connecter', hint: 'Pas de compte ? Demandez à l’administrateur d’en créer un.',
                failed: 'Nom d’utilisateur ou mot de passe incorrect', blocked: 'Trop de tentatives, réessayez dans 15 minutes', network: 'Impossible de joindre le serveur' }
        };
        let lang = 'zh';
        try { lang = localStorage.getItem('mapweb.lang') || (navigator.language || 'zh').slice(0, 2); } catch { /* 忽略 */ }
        const text = TEXT[lang] || TEXT.en;
        document.documentElement.lang = lang in TEXT ? lang : 'en';
        document.querySelectorAll('[data-t]').forEach(el => { el.textContent = text[el.dataset.t]; });

        // 只接受本站的相对路径，不能被拿来跳到别的网站
        const next = new URLSearchParams(location.search).get('next');
        const target = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';

        const form = document.getElementById('form');
        const error = document.getElementById('error');
        form.username.focus();
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            error.textContent = '';
            const button = form.querySelector('button');
            button.disabled = true;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value })
                });
                if (response.ok) {
                    // 换了人登录：清掉 Service Worker 里上一个人的接口缓存
                    try { await caches.delete('mapweb-runtime'); } catch { /* 忽略 */ }
                    location.replace(target);
                    return;
                }
                error.textContent = response.status === 429 ? text.blocked : text.failed;
                form.password.select();
            } catch {
                error.textContent = text.network;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>

</html>
