<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3D2B1F">
    <title>Periplus · 行纪</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="img/mapweb-192.png">

    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
    <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
    <link rel="stylesheet" href="css/app.css">

    <script src="vendor/leaflet/leaflet.js" defer></script>
    <script src="vendor/markercluster/leaflet.markercluster.js" defer></script>
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <!-- 图标（线条风格，参考 Lucide） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
            <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z"/></symbol>
            <symbol id="i-timeline" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></symbol>
            <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/></symbol>
            <symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></symbol>
            <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></symbol>
            <symbol id="i-locate" viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8z"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
            <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
            <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></symbol>
            <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
            <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
            <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
            <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
            <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
            <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
            <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
            <symbol id="i-review" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m12 13 1.2 2.5 2.8.4-2 2 .5 2.7-2.5-1.3-2.5 1.3.5-2.7-2-2 2.8-.4z"/></symbol>
            <symbol id="i-split" viewBox="0 0 24 24"><path d="M3 12h6M15 12h6"/><path d="m12 4 0 16"/><path d="M18 9l3 3-3 3"/></symbol>
            <symbol id="i-checkin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></symbol>
            <symbol id="i-track" viewBox="0 0 24 24"><path d="M4 20c0-4 4-4 4-8s-4-4-4-8"/><circle cx="18" cy="7" r="2"/><circle cx="12" cy="17" r="2"/><path d="M8 12h8"/></symbol>
            <symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></symbol>
            <symbol id="i-stats" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16v-3M12 16V8M17 16v-6"/></symbol>
            <symbol id="i-trips" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
            <symbol id="i-lighten" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
        </defs>
    </svg>

    <div id="map" aria-label="map"></div>

    <!-- 左侧工具栏 -->
    <nav class="toolbar glass" aria-label="toolbar">
        <!-- 点熊猫收起 / 展开下面的按钮，腾出地图空间 -->
        <button class="brand" data-action="toggle-toolbar" data-i18n-title="toggleToolbar" aria-expanded="true" aria-controls="toolbar-tools"><img src="img/ayacloud.png" alt=""></button>
        <div class="toolbar-tools" id="toolbar-tools"><div class="toolbar-inner">
        <button class="tool tool-add" data-action="add-pin" data-i18n-title="addPin"><svg><use href="#i-plus"/></svg></button>
        <button class="tool" data-action="checkin" data-i18n-title="checkin"><svg><use href="#i-checkin"/></svg></button>
        <button class="tool" data-action="settings" data-i18n-title="settings"><svg><use href="#i-settings"/></svg></button>
        <button class="tool" data-action="history" data-i18n-title="historyMap"><svg><use href="#i-history"/></svg></button>
        <button class="tool" data-action="timeline" data-i18n-title="personalTimeline"><svg><use href="#i-timeline"/></svg></button>
        <button class="tool" data-action="journeys" data-i18n-title="journeys"><svg><use href="#i-route"/></svg></button>
        <button class="tool" data-action="trips" data-i18n-title="trips"><svg><use href="#i-trips"/></svg></button>
        <button class="tool" data-action="gallery" data-i18n-title="gallery"><svg><use href="#i-camera"/></svg></button>
        <button class="tool" data-action="review" data-i18n-title="review"><svg><use href="#i-review"/></svg></button>
        <button class="tool" data-action="lighten" data-i18n-title="lighten"><svg><use href="#i-lighten"/></svg></button>
        <button class="tool" data-action="tracks" data-i18n-title="tracks"><svg><use href="#i-track"/></svg></button>
        <button class="tool" data-action="stats" data-i18n-title="stats"><svg><use href="#i-stats"/></svg></button>
        <button class="tool" data-action="data" data-i18n-title="data"><svg><use href="#i-data"/></svg></button>
        <a class="tool" href="pages/tools.html" target="_blank" rel="noopener" data-i18n-title="tools"><svg><use href="#i-tools"/></svg></a>
        </div></div>
    </nav>

    <!-- 右侧地图控件（缩放用滚轮 / 双指，不再放按钮） -->
    <div class="map-controls">
        <button class="control-single glass" data-action="locate" data-i18n-title="locateMe"><svg><use href="#i-locate"/></svg></button>
    </div>

    <div id="add-hint" class="hint glass" hidden data-i18n="addPinHint"></div>

    <!-- 时间轴（历史地图 / 个人时间轴共用） -->
    <section id="timebar" class="glass" hidden>
        <div class="timebar-label" id="timebar-label"></div>
        <div class="timebar-row">
            <button data-action="time-play" class="icon-btn"><svg><use href="#i-play"/></svg></button>
            <button data-action="time-back" class="icon-btn" data-i18n-title="stepBack"><svg><use href="#i-left"/></svg></button>
            <div id="timebar-tape" class="timebar-tape" role="slider" tabindex="0"><canvas></canvas></div>
            <button data-action="time-forward" class="icon-btn" data-i18n-title="stepForward"><svg><use href="#i-right"/></svg></button>
            <button data-action="time-close" class="icon-btn" data-i18n-title="close"><svg><use href="#i-x"/></svg></button>
        </div>
    </section>

    <!-- 搜索 -->
    <form id="search" class="glass" role="search" autocomplete="off">
        <svg class="search-icon"><use href="#i-search"/></svg>
        <input type="search" id="search-input" data-i18n-placeholder="searchPlaceholder">
        <div id="search-results" hidden></div>
    </form>

    <!-- 侧边面板：标注详情 / 设置 / 旅行家 / 数据 -->
    <aside id="panel" class="glass" hidden>
        <header class="panel-header">
            <h2 id="panel-title"></h2>
            <button class="icon-btn" data-action="panel-close" data-i18n-title="close"><svg><use href="#i-x"/></svg></button>
        </header>
        <div id="panel-body" class="panel-body"></div>
    </aside>

    <div id="toasts" aria-live="polite"></div>

    <dialog id="confirm-dialog">
        <form method="dialog">
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button value="cancel" class="btn" data-i18n="cancel"></button>
                <button value="ok" class="btn btn-danger" data-i18n="delete"></button>
            </div>
        </form>
    </dialog>

    <input type="file" id="photo-input" accept="image/jpeg,image/heic,.heic" multiple hidden>
    <input type="file" id="gpx-input" accept=".gpx,application/gpx+xml" multiple hidden>
    <input type="file" id="backup-input" accept=".zip,.json,application/zip,application/json" hidden>
</body>

</html>
